<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jugadores - Formulario</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

  <div th:replace="~{fragments/encabezado :: encabezado('jugadores')}"></div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <div class="card shadow-sm">
          <div class="card-header">
            <h4 class="mb-0"
                th:text="${jugador.id == null} ? 'Nuevo Jugador' : ('Editar Jugador (id ' + ${jugador.id} + ')')">Nuevo Jugador</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/jugadores/guardar}" th:object="${jugador}" method="post" novalidate>

              <input type="hidden" th:field="*{id}">

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid" placeholder="Ej: Luis" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
              </div>

              <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" id="apellido" class="form-control" th:field="*{apellido}" th:errorclass="is-invalid" placeholder="Ej: Martínez" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
              </div>

              <div class="mb-3">
                <label for="numero" class="form-label">Número de camiseta</label>
                <input type="number" id="numero" class="form-control" th:field="*{numero}" th:errorclass="is-invalid" placeholder="Ej: 10" min="1" max="99">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
              </div>

              <div class="mb-3">
                <label for="posicion" class="form-label">Posición</label>
                <select id="posicion" class="form-select" th:field="*{posicion}" th:errorclass="is-invalid">
                  <option value="">-- Seleccione --</option>
                  <option th:each="p : ${posiciones}" th:value="${p}" th:text="${p}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('posicion')}" th:errors="*{posicion}"></div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-violet"
                        th:text="${jugador.id == null} ? 'Guardar' : 'Actualizar'">Guardar</button>
                <a th:href="@{/jugadores/nuevo}" class="btn btn-outline-secondary">Limpiar</a>
                <a th:href="@{/jugadores}" class="btn btn-outline-violet ms-auto">Ver lista &rarr;</a>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
