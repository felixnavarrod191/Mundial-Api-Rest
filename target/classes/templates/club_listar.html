<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clubes - Lista</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

  <div th:replace="~{fragments/encabezado :: encabezado('clubes')}"></div>

  <div class="container pb-5">

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
      <span th:text="${mensaje}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h3 class="mb-0">Clubes
        <span class="badge bg-secondary" th:text="${#lists.size(lista)}">0</span>
      </h3>
      <form th:action="@{/clubes}" method="get" class="d-flex gap-2">
        <input type="text" name="buscar" class="form-control" th:value="${buscar}"
               placeholder="Buscar por nombre">
        <button type="submit" class="btn btn-outline-violet">Buscar</button>
        <a th:href="@{/clubes}" class="btn btn-outline-secondary">Limpiar</a>
      </form>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>ID</th><th>Club</th><th>Asociación</th><th>Entrenador</th>
              <th>Jugadores</th><th>Competiciones</th><th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c, fila : ${lista}">
              <td th:text="${fila.count}"></td>
              <td th:text="${c.id}"></td>
              <td class="fw-bold" th:text="${c.nombre}"></td>
              <td>
                <span th:if="${c.asociacion != null}"
                      th:text="${c.asociacion.siglas + ' - ' + c.asociacion.nombre}"></span>
              </td>
              <td>
                <span th:if="${c.entrenador != null}"
                      th:text="${c.entrenador.nombre + ' ' + c.entrenador.apellido}"></span>
              </td>
              <td>
                <span class="badge bg-violet mb-1"
                      th:text="${#lists.size(c.jugadores) + ' jugadores'}"></span><br>
                <span class="badge bg-primary me-1 mb-1" th:each="j : ${c.jugadores}"
                      th:if="${j != null}"
                      th:text="${'(' + j.numero + ') ' + j.nombre + ' ' + j.apellido}"></span>
              </td>
              <td>
                <span class="badge bg-azul me-1" th:each="k : ${c.competiciones}"
                      th:if="${k != null}" th:text="${k.nombre}"></span>
              </td>
              <td class="text-end text-nowrap">
                <a th:href="@{/clubes/editar/{id}(id=${c.id})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/clubes/eliminar/{id}(id=${c.id})}" method="post"
                      class="d-inline"
                      onsubmit="return confirm('Eliminar este club?');">
                  <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lista)}">
              <td colspan="8" class="text-center text-muted py-4">No hay clubes para mostrar</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="mt-3">
      <a th:href="@{/clubes/nuevo}" class="btn btn-violet">&larr; Nuevo Club (formulario)</a>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
