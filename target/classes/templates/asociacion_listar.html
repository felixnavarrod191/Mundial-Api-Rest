<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asociaciones - Lista</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

  <div th:replace="~{fragments/encabezado :: encabezado('asociaciones')}"></div>

  <div class="container pb-5">

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
      <span th:text="${mensaje}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h3 class="mb-0">Asociaciones
        <span class="badge bg-secondary" th:text="${#lists.size(lista)}">0</span>
      </h3>
      <form th:action="@{/asociaciones}" method="get" class="d-flex gap-2">
        <input type="text" name="buscar" class="form-control" th:value="${buscar}"
               placeholder="Buscar por nombre">
        <button type="submit" class="btn btn-outline-violet">Buscar</button>
        <a th:href="@{/asociaciones}" class="btn btn-outline-secondary">Limpiar</a>
      </form>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr><th>#</th><th>ID</th><th>Nombre</th><th>País</th><th>Siglas</th><th>Presidente</th><th class="text-end">Acciones</th></tr>
          </thead>
          <tbody>
            <tr th:each="x, fila : ${lista}">
              <td th:text="${fila.count}"></td>
              <td th:text="${x.id}"></td>
              <td th:text="${x.nombre}"></td>
              <td th:text="${x.pais}"></td>
              <td th:text="${x.siglas}"></td>
              <td th:text="${x.presidente}"></td>
              <td class="text-end text-nowrap">
                <a th:href="@{/asociaciones/editar/{id}(id=${x.id})}"
                   class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/asociaciones/eliminar/{id}(id=${x.id})}" method="post"
                      class="d-inline"
                      onsubmit="return confirm('Eliminar este registro?');">
                  <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lista)}">
              <td colspan="7" class="text-center text-muted py-4">
                No hay registros para mostrar
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="mt-3">
      <a th:href="@{/asociaciones/nuevo}" class="btn btn-violet">&larr; Nueva Asociación (formulario)</a>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
