<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asociaciones - Formulario</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

  <div th:replace="~{fragments/encabezado :: encabezado('asociaciones')}"></div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <div class="card shadow-sm">
          <div class="card-header">
            <h4 class="mb-0"
                th:text="${asociacion.id == null} ? 'Nueva Asociación' : ('Editar Asociación (id ' + ${asociacion.id} + ')')">Nueva Asociación</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/asociaciones/guardar}" th:object="${asociacion}" method="post" novalidate>

              <input type="hidden" th:field="*{id}">

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid" placeholder="Ej: Federación Colombiana de Fútbol" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
              </div>

              <div class="mb-3">
                <label for="pais" class="form-label">País</label>
                <input type="text" id="pais" class="form-control" th:field="*{pais}" th:errorclass="is-invalid" placeholder="Ej: Colombia" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></div>
              </div>

              <div class="mb-3">
                <label for="siglas" class="form-label">Siglas</label>
                <input type="text" id="siglas" class="form-control" th:field="*{siglas}" th:errorclass="is-invalid" placeholder="Ej: FCF" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('siglas')}" th:errors="*{siglas}"></div>
              </div>

              <div class="mb-3">
                <label for="presidente" class="form-label">Presidente</label>
                <input type="text" id="presidente" class="form-control" th:field="*{presidente}" th:errorclass="is-invalid" placeholder="Nombre del presidente" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('presidente')}" th:errors="*{presidente}"></div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-violet"
                        th:text="${asociacion.id == null} ? 'Guardar' : 'Actualizar'">Guardar</button>
                <a th:href="@{/asociaciones/nuevo}" class="btn btn-outline-secondary">Limpiar</a>
                <a th:href="@{/asociaciones}" class="btn btn-outline-violet ms-auto">Ver lista &rarr;</a>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
