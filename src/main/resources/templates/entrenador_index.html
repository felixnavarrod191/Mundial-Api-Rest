<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrenadores - Formulario</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

  <div th:replace="~{fragments/encabezado :: encabezado('entrenadores')}"></div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <div class="card shadow-sm">
          <div class="card-header">
            <h4 class="mb-0"
                th:text="${entrenador.id == null} ? 'Nuevo Entrenador' : ('Editar Entrenador (id ' + ${entrenador.id} + ')')">Nuevo Entrenador</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/entrenadores/guardar}" th:object="${entrenador}" method="post" novalidate>

              <input type="hidden" th:field="*{id}">

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid" placeholder="Ej: Carlos" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
              </div>

              <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" id="apellido" class="form-control" th:field="*{apellido}" th:errorclass="is-invalid" placeholder="Ej: Gómez" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
              </div>

              <div class="mb-3">
                <label for="edad" class="form-label">Edad</label>
                <input type="number" id="edad" class="form-control" th:field="*{edad}" th:errorclass="is-invalid" placeholder="Ej: 45" min="18" max="100">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}"></div>
              </div>

              <div class="mb-3">
                <label for="nacionalidad" class="form-label">Nacionalidad</label>
                <input type="text" id="nacionalidad" class="form-control" th:field="*{nacionalidad}" th:errorclass="is-invalid" placeholder="Ej: Colombiana" >
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nacionalidad')}" th:errors="*{nacionalidad}"></div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-violet"
                        th:text="${entrenador.id == null} ? 'Guardar' : 'Actualizar'">Guardar</button>
                <a th:href="@{/entrenadores/nuevo}" class="btn btn-outline-secondary">Limpiar</a>
                <a th:href="@{/entrenadores}" class="btn btn-outline-violet ms-auto">Ver lista &rarr;</a>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
